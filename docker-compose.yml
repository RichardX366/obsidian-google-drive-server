version: '3.9'
services:
  ogd:
    container_name: ogd
    image: 'richardxregistry/ogd-server:latest'
    restart: unless-stopped
    ports:
      - '3005'
    labels:
      - traefik.enable=true
      - traefik.http.routers.ogd.rule=Host(`ogd-server.richardxiong.com`)
    environment:
      - CLIENT_SECRET=$CLIENT_SECRET

networks:
  default:
    name: proxy
    external: true
